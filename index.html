<style>
:root { --line:#e2e5ea; --muted:#7a7f88; }
* { box-sizing:border-box; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  max-width: 460px; margin: 1.2rem auto 3rem; padding: 0 1rem;
  color:#1c1f24; background:#fff;
}
h1 { font-size: 1rem; margin: 0 0 .7rem; color:var(--muted); font-weight:700; }

input, select, button, textarea { font-size:1rem; font-family:inherit; }
input[type=number], select {
  width:100%; padding:.6rem .7rem; border:1px solid #ccd1d9; border-radius:9px; background:#fff;
}
input[type=number]:focus, select:focus { outline:2px solid #9db8e8; outline-offset:1px; border-color:#7f9fd8; }

/* モード切替 */
.mode-toggle { display:flex; gap:.5rem; margin-bottom:1rem; }
.mode-btn {
  flex:1; padding:.6rem; border:1px solid var(--line); border-radius:9999px;
  background:#fafbfc; font-weight:700; cursor:pointer; transition:all .15s ease;
}
.mode-btn.retail.active { background:#ffe9e9; border-color:#ffbcbc; color:#9a2a2a; }
.mode-btn.wholesale.active { background:#eaf3ff; border-color:#bfd8ff; color:#244b8a; }

/* 1. 売価 */
.field-label { font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:.3rem; }
.sale-row { display:flex; gap:.5rem; }
.sale-row #salePrice { flex:1; font-size:1.5rem; font-weight:700; padding:.6rem .7rem; text-align:right; }
.sale-row #currency { width:88px; flex:none; }

/* 2. 答え */
.card { border-radius:14px; padding:.9rem 1rem 1rem; margin-top:.7rem; border:1px solid; }
.card.retail    { background:#fff6f6; border-color:#ffd8d8; }
.card.wholesale { background:#f3f8ff; border-color:#d2e2ff; }
.rc-label { font-size:.78rem; font-weight:700; color:var(--muted); }
.rc-main  { font-size:2.35rem; font-weight:800; line-height:1.1; letter-spacing:-.02em; margin:.05rem 0 .1rem; }
.card.retail    .rc-main { color:#9a2a2a; }
.card.wholesale .rc-main { color:#244b8a; }
.rc-main.empty { color:#c3c7cd; font-size:1.5rem; font-weight:700; }
.rc-inc { font-size:.85rem; color:var(--muted); font-weight:700; margin-bottom:.35rem; }
.rc-profit { font-size:1.15rem; font-weight:800; }
.rc-profit span { font-size:.82rem; font-weight:700; color:var(--muted); margin-left:.35rem; }
.rc-fee {
  font-size:.8rem; color:#454a52; margin-top:.6rem; padding-top:.55rem;
  border-top:1px solid rgba(0,0,0,.08); line-height:1.6;
}
.rc-fee b { color:#1f3f7a; }
details.bd { margin-top:.4rem; }
details.bd summary { font-size:.78rem; color:var(--muted); cursor:pointer; }
details.bd .in { font-size:.78rem; color:#555; line-height:1.8; margin-top:.3rem; }

/* 3. オークション */
.section { margin-top:1.1rem; }
#auctionCat { margin-top:.4rem; }
#feeNote { font-size:.78rem; color:#4a4f57; margin-top:.45rem; line-height:1.6; }
#feeNote b { color:#1f3f7a; }
#feeNote .sub { color:#9aa0a8; }
#customFeeWrap { margin-top:.5rem; display:none; }

/* 4. 目標利益率 */
#margin { font-size:1.15rem; font-weight:700; }

/* 5. その他の設定 */
.settings { margin-top:1.4rem; border-top:1px solid var(--line); padding-top:.9rem; }
.settings-head { font-size:.85rem; font-weight:700; color:#3b4048; }
.settings-body { margin-top:.7rem; }
.settings-body .field-label { margin-top:.85rem; }
.settings-body .field-label:first-child { margin-top:0; }
.row { display:flex; gap:.6rem; }
.row > div { flex:1; }
.hint { font-size:.75rem; color:#9aa0a8; margin-top:.25rem; }
.check { display:flex; gap:.45rem; align-items:center; margin-top:.8rem; font-size:.88rem; font-weight:600; }
.check input { width:auto; }
.foot { margin-top:1.4rem; font-size:.74rem; color:#b0b5bc; text-align:center; line-height:1.7; }

/* 売り先くらべ */
details.sell { margin-top:1rem; border:1px solid var(--line); border-radius:10px; padding:.6rem .7rem; background:#fcfcfd; }
details.sell > summary {
  cursor:pointer; font-size:.85rem; font-weight:700; color:#3b4048; list-style:none;
  display:flex; align-items:baseline; gap:.4rem;
}
details.sell > summary::-webkit-details-marker { display:none; }
details.sell > summary::before { content:'▸'; color:var(--muted); font-size:.75rem; flex:none; }
details.sell[open] > summary::before { content:'▾'; }
details.sell > summary > .lbl { flex:none; white-space:nowrap; }
#sellSummary { flex:1; font-weight:400; font-size:.76rem; color:var(--muted); }
.sell-body { margin-top:.7rem; }
.sv {
  display:flex; align-items:center; gap:.5rem; padding:.45rem .5rem; border-radius:8px;
  cursor:pointer; border:1px solid transparent;
}
.sv:hover { background:#eef2f8; border-color:#dde4ef; }
.sv-rank { width:1.6rem; flex:none; text-align:right; font-size:.75rem; color:var(--muted); font-weight:700; }
.sv-name { flex:1; font-size:.85rem; font-weight:700; min-width:0; }
.sv-name small { display:block; font-weight:400; font-size:.72rem; color:var(--muted); }
.sv-fee { text-align:right; font-size:.85rem; font-weight:800; white-space:nowrap; }
.sv-fee small { display:block; font-weight:600; font-size:.72rem; color:var(--muted); }
.sv.best { background:#f0f9f2; border-color:#b8e0c4; }
.sv.best .sv-rank { color:#2e7d32; }
.sv.best .sv-fee { color:#2e7d32; }
.sv-fail { font-size:.7rem; color:#b06a00; margin:.1rem 0 .3rem 2.1rem; }
</style>
</head>
<body>

<h1>仕入れ値計算（売上比利益率）</h1>

<div class="mode-toggle" role="tablist" aria-label="モード切替">
  <button class="mode-btn retail active" id="btnRetail">小売（内税）</button>
  <button class="mode-btn wholesale" id="btnWholesale">業販（外税）</button>
</div>

<!-- 1. 売価 -->
<div class="field-label" id="salePriceLabel">売価（円）</div>
<div class="sale-row">
  <input id="salePrice" type="number" inputmode="numeric" placeholder="0"/>
  <select id="currency">
    <option value="JPY">JPY</option>
    <option value="USD">USD</option>
  </select>
</div>
<div id="fxWrap" style="display:none;margin-top:.5rem;">
  <div class="field-label">為替レート（1 USD = JPY）</div>
  <div style="display:flex;gap:.5rem;">
    <input id="fxRate" type="number" style="flex:1;"/>
    <button id="fxRefresh" type="button" style="width:84px;flex:none;padding:.6rem .2rem;border:1px solid #ccd1d9;border-radius:9px;background:#fafbfc;font-weight:700;cursor:pointer;">再取得</button>
  </div>
  <div class="hint" id="fxStatus">自動取得します。取れないときは手で入力できます</div>
</div>

<!-- 2. 答え -->
<div class="card retail" id="resultCard">
  <div class="rc-label">仕入れ値（税抜）</div>
  <div class="rc-main empty" id="rcMain">売価を入れてください</div>
  <div class="rc-inc" id="rcInc" style="display:none;"></div>
  <div class="rc-profit" id="rcProfit" style="display:none;"></div>
  <div class="rc-fee" id="rcFee" style="display:none;"></div>
  <details class="bd" id="rcBreakdown" style="display:none;">
    <summary>内訳</summary>
    <div class="in" id="rcBreakdownIn"></div>
  </details>
</div>

<!-- 3. オークション -->
<div class="section">
  <div class="field-label">仕入手数料（オークション）</div>
  <select id="auctionSelect"></select>
  <select id="auctionCat" style="display:none;"></select>
  <div id="customFeeWrap">
    <div class="field-label" style="margin-top:.5rem;">手数料（%）</div>
    <input id="auctionFeeRate" type="number" value="5"/>
  </div>
  <div id="feeNote"></div>
</div>

<!-- 4. 目標利益率（よく変えるので表に出しておく） -->
<div class="section">
  <div class="field-label">目標利益率（%・売上比）</div>
  <input id="margin" type="number" inputmode="decimal" value="20"/>
</div>

<!-- 5. その他の設定 -->
<div class="settings" id="settings">
  <div class="settings-head">その他の設定</div>
  <div class="settings-body">

    <div id="retailExtras">
      <div class="field-label">送料（円・原価に加算）</div>
      <input id="shippingYen" type="number" value="700"/>
      <div class="field-label">出品代行手数料（円・原価に加算）</div>
      <input id="listingFeeYen" type="number" value="1320"/>
      <div class="hint">※売価がUSDでも円で計上</div>
    </div>

    <div id="wholesaleExtras" style="display:none;">
      <div class="field-label">その他費用（円）</div>
      <input id="otherCostYen" type="number" value="0"/>
      <label class="check">
        <input id="wholesaleTaxIn" type="checkbox"/>
        業販を内税で計算する（売価は税抜を入力）
      </label>
    </div>

    <div class="row" style="margin-top:.85rem;">
      <div>
        <div class="field-label">販売手数料（%）</div>
        <input id="platformFee" type="number" value="10"/>
      </div>
      <div>
        <div class="field-label">仕入消費税（%）</div>
        <input id="tax" type="number" value="10"/>
      </div>
    </div>

    <!-- 売り先の手数料くらべ -->
    <details class="sell" id="sellBox">
      <summary><span class="lbl">売り先の手数料をくらべる</span><span id="sellSummary"></span></summary>
      <div class="sell-body">
        <div class="row" style="margin-bottom:.5rem;">
          <div>
            <div class="field-label">商材</div>
            <select id="sellKind"></select>
          </div>
          <div>
            <div class="field-label">ブランド</div>
            <select id="sellBrand"></select>
          </div>
        </div>
        <div id="sellList"></div>
        <div class="hint" id="sellNote"></div>
      </div>
    </details>

  </div>
</div>

<div class="foot">入力するとその場で計算します<br>設定は次に開いたときも残ります</div>

<script>
/* =====================================================================
   仕入手数料（＝落札したときに会場へ払う「買い手数料」）の一覧。
   「手数料まとめ」に書いてある落札手数料をそのまま入れてある。

   手数料の形は3通り。
     rate  … 一律の％
     tier  … 落札金額の段で変わる（％のことも、定額◯◯円のこともある）
     cats  … 商材（バッグ／ジュエリー／時計 など）で変わる

   ★ブランドでは変わらない。変わるのは「商材」だけで、3会場のみ。
     ブランド別に変わるのは YBA の“出品(売り)手数料”で、買いには関係しない。
     商材は バッグ → ジュエリー の順に並べてある。

   tier の hi は「その段に入る上限額（その額を含む）」。
   ＋税と書いてある会場は、実際に払う額に合わせて税込の率で入れてある。
   ===================================================================== */
const AUCTIONS = [
  { id:'custom', name:'カスタム（手入力）', fee:{kind:'custom'},
    note:'下の欄に自分で％を入れる。' },

  { id:'aucnet', name:'オークネット', fee:{kind:'rate', rate:4},
    note:'落札手数料 <b>4%</b>（プレミアム会員）' },

  { id:'eco', name:'エコリング', fee:{kind:'tier', tiers:[
      {hi:10000, yen:500}, {hi:49999, yen:1000}, {hi:99999, yen:2000},
      {hi:499999, yen:4000}, {hi:999999, yen:8000}, {hi:Infinity, yen:10000}]},
    note:'落札手数料は<b>％ではなく定額</b>で、落札金額の段で決まる。'
       + '<br><span class="sub">1万円まで500円／5万円未満1,000円／10万円未満2,000円／'
       + '50万円未満4,000円／100万円未満8,000円／100万円以上10,000円</span>' },
    // ※出品側の費用（写真代400円など）は、下の「売り先の手数料をくらべる」に移した

  { id:'starbuyers', name:'スターバイヤー', fee:{kind:'cats', cats:[
      {label:'バッグ・ジュエリー・時計・アクセサリー・小物', rate:5},
      {label:'アパレル・靴・シルバーブランド', rate:10}]},
    note:'商材で変わる。' },

  { id:'jba_tokyo', name:'JBAオークション東京', fee:{kind:'tier', tiers:[
      {hi:9999, yen:500}, {hi:Infinity, rate:1}]},
    note:'落札手数料 <b>1万円未満は1点500円／1万円以上は1%</b>' },

  { id:'jba_kanazawa', name:'JBAオークション金沢', fee:{kind:'cats', cats:[
      {label:'バッグ・ジュエリー・その他', rate:1},
      {label:'時計（落札手数料は免除）', rate:0}]},
    note:'落札手数料 <b>1%</b>。時計だけ免除。' },

  { id:'komehyo', name:'コメ兵オークション', fee:{kind:'rate', rate:3},
    note:'落札手数料 <b>3%</b>' },

  { id:'reva', name:'リバオク', fee:{kind:'rate', rate:3},
    note:'落札手数料 <b>3%</b>' },

  { id:'monobank', name:'ものばんく', fee:{kind:'rate', rate:3},
    note:'買い手数料 <b>3%</b>' },

  { id:'jrb', name:'JRBオークション', fee:{kind:'rate', rate:3},
    note:'買い手数料 <b>3%</b>' },

  { id:'otakaraya', name:'おたからやオークション', fee:{kind:'rate', rate:3},
    note:'買い手数料 <b>3%</b>' },

  { id:'timeless', name:'タイムレスオークション', fee:{kind:'rate', rate:3},
    note:'買い手数料 <b>3%</b>（平場・オンライン共通）' },

  { id:'daikichi', name:'大吉オークション', fee:{kind:'cats', cats:[
      {label:'ブランド品（バッグ・小物）', rate:5},
      {label:'ジュエリー', rate:3},
      {label:'時計', rate:3}]},
    note:'商材で変わる。ブランド品だけ5%で、ジュエリーと時計は3%。' },

  { id:'trefac', name:'トレファクオークション', fee:{kind:'tier', tiers:[
      {hi:199999, rate:5.5}, {hi:Infinity, rate:1.1}]},
    note:'落札手数料 <b>20万円未満 5%＋税（=5.5%）／20万円以上 1%＋税（=1.1%）</b>' },

  { id:'yba', name:'YBA', fee:{kind:'rate', rate:3},
    note:'落札手数料 <b>一律3%</b><br><span class="sub">※買手参加費6,600円/名は1回ごとの費用なので入れていない</span>' },

  { id:'penguin', name:'ペンギンオークション', fee:{kind:'rate', rate:5},
    note:'買い手数料 <b>5%</b><br><span class="sub">※参加費5,000円は1回ごとの費用なので入れていない</span>' },

  { id:'unioku', name:'ユニオク', fee:{kind:'rate', rate:5},
    note:'買い手数料 <b>5%</b>' },

  { id:'apre', name:'アプレオークション', fee:{kind:'rate', rate:5},
    note:'落札手数料 <b>5%</b><br><span class="sub">※成約時参加費3,000円は1回ごとの費用なので入れていない</span>' },

  { id:'prime', name:'プライムオークション', fee:{kind:'rate', rate:8},
    note:'買い手数料 <b>8%</b>' }
];


/* =====================================================================
   売り先（出品する会場）の手数料。
   「手数料まとめ」の販売手数料・出品手数料をそのまま入れてある。

   ここに入れているのは<売れたときに必ずかかる分>だけ。
     ・販売／出品手数料（％または定額）
     ・1点ごとに必ずかかるもの（写真代など）
   流れたときの費用（不落札手数料・返送料）と、1回ごとの費用（参加費）は
   金額には足さず、注記として出す。1商品あたりに割れないため。

   ＋税と書いてある会場は、実際に払う額に合わせて税込の率で入れてある。
   ===================================================================== */

/** 段で決まる手数料。hi はその段に入る上限額（その額を含む） */
function tierFee(tiers) {
  return (price) => {
    for (const t of tiers) {
      if (price <= t.hi) {
        return t.yen != null
          ? { yen: t.yen, label: '定額' + t.yen.toLocaleString('ja-JP') + '円' }
          : { yen: price * t.rate / 100, label: t.rate + '%' };
      }
    }
    const t = tiers[tiers.length - 1];
    return t.yen != null
      ? { yen: t.yen, label: '定額' + t.yen.toLocaleString('ja-JP') + '円' }
      : { yen: price * t.rate / 100, label: t.rate + '%' };
  };
}

const SELL_VENUES = [
  { id:'prime', name:'プライム', fee: tierFee([{ hi:Infinity, rate:0 }]),
    note:'売り手数料 無料' },

  { id:'jba_kanazawa', name:'JBA金沢', fee: tierFee([
      { hi:29999, rate:10 }, { hi:99999, rate:4 }, { hi:999999, rate:3 },
      { hi:4999999, rate:2.5 }, { hi:9999999, rate:2 }, { hi:Infinity, rate:1 }]) },

  { id:'jba_tokyo', name:'JBA東京', fee: tierFee([
      { hi:9999, rate:10 }, { hi:49999, rate:5 }, { hi:Infinity, rate:3 }]),
    note:'バッグ前半・後半 共通' },

  { id:'jrb', name:'JRB', fee: tierFee([
      { hi:9999, rate:10 }, { hi:49999, rate:5 }, { hi:99999, rate:3 },
      { hi:Infinity, rate:0 }]),
    note:'10万円以上は無料' },

  { id:'eco', name:'エコリング', fee: tierFee([
      { hi:10000, yen:500 }, { hi:49999, yen:1000 }, { hi:Infinity, yen:2000 }]),
    perItem:400, perItemLabel:'写真代400円' },

  { id:'aucnet', name:'オークネット', fee: tierFee([{ hi:Infinity, rate:3 }]),
    min:700, perItem:300, perItemLabel:'写真代300円',
    fail:'流札手数料 0〜900円（成約率による）', note:'成約手数料が700円に満たないときは一律700円' },

  { id:'starbuyers', name:'スターバイヤー', fee: tierFee([{ hi:Infinity, yen:1100 }]),
    fail:'不落札 550円/点（税込）', note:'落札額にかかわらず1点1,100円（税込）' },

  { id:'komehyo', name:'コメ兵', fee: tierFee([{ hi:20000, yen:1000 }, { hi:Infinity, rate:5 }]),
    perItem:500, perItemLabel:'出品手数料500円',
    fail:'不落札 500円/点／事務諸費用 1カテゴリーごと1,000円' },

  { id:'trefac', name:'トレファク', fee: tierFee([
      { hi:2999, rate:11 }, { hi:9999, rate:5.5 }, { hi:199999, rate:3.3 },
      { hi:Infinity, rate:1.1 }]),
    fail:'不落札 550円/点（税込）', note:'表示は税込（10%＋税＝11% など）' },

  { id:'reva', name:'リバオク', fee: tierFee([{ hi:Infinity, rate:3 }]),
    fail:'不落札 1,100円/点' },

  { id:'monobank', name:'ものばんく', fee: tierFee([{ hi:Infinity, rate:5 }]),
    note:'写真手数料なし' },

  { id:'timeless_hiraba', name:'タイムレス（平場）', fee: tierFee([
      { hi:10000, rate:10 }, { hi:Infinity, rate:5 }]) },

  { id:'timeless_online', name:'タイムレス（オンライン）', fee: tierFee([{ hi:Infinity, rate:5 }]),
    onlyKinds:['bag'], fail:'流れ 550円', note:'バッグ' },

/** その会場に売価 price で出したときの手数料（円）と内訳 */
function sellCost(v, price, kind, brand) {
  let f = null;
  if (v.byBrand) {
    const fn = v.byBrand[brand] || v.byBrand.base;
    f = fn(price);
    if (!f) f = v.byBrand.base(price);   // ブランド別の対象外なら基準の表
  } else if (v.byKind) {
    f = (v.byKind[kind] || v.byKind.bag)(price);
  } else {
    f = v.fee(price);
  }
  let yen = f.yen;
  let label = f.label;
  if (v.min && yen < v.min) { yen = v.min; label = '最低' + v.min.toLocaleString('ja-JP') + '円'; }
  if (v.perItem) yen += v.perItem;
  return { yen: Math.round(yen), label };
}

const $ = (id) => document.getElementById(id);
function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }
function num(id){ return parseFloat($(id).value) || 0; }

/* 会場の手数料を「段」の並びに直す。一律％も商材別も、段が1つだけの tier として扱う。
   返すのは [{lo, hi, rate, yen}]（lo・hi はどちらもその額を含む）。 */
function feeTiers(auction, catIndex) {
  const f = auction.fee;
  let tiers;
  if (f.kind === 'tier') tiers = f.tiers;
  else if (f.kind === 'cats') tiers = [{ hi: Infinity, rate: f.cats[catIndex] ? f.cats[catIndex].rate : 0 }];
  else if (f.kind === 'rate') tiers = [{ hi: Infinity, rate: f.rate }];
  else tiers = [{ hi: Infinity, rate: num('auctionFeeRate') }];
  let lo = 0;
  return tiers.map(t => {
    const o = { lo: lo, hi: t.hi, rate: t.rate || 0, yen: t.yen || 0 };
    lo = t.hi === Infinity ? Infinity : t.hi + 1;
    return o;
  });
}

/* 段のある手数料でも正しい仕入れ値を出すための解き方。

   むずかしいのは、手数料が仕入れ値で決まるのに、その仕入れ値を求めたいところ。
   （5万円で買えば手数料2,000円、4万9千円なら1,000円、と行ったり来たりする）

   そこで「その段だと決めつけて計算し、答えがその段に収まっているか確かめる」。
   収まっていればそれが答え。段を飛び越したときは、その段のいちばん上
   （例：49,999円）が答えになる。最後に、候補のうち一番高く出せる額を採る。 */
function solveWithTiers(tiers, solveB) {
  let best = null, used = null;
  tiers.forEach(t => {
    const B = Math.floor(solveB(t.rate / 100, t.yen));
    let cand = null;
    if (B >= t.lo && B <= t.hi) cand = B;
    else if (B > t.hi) cand = t.hi;
    if (cand !== null && cand > 0 && (best === null || cand > best)) { best = cand; used = t; }
  });
  if (best === null) return { bid: 0, tier: tiers[0] };
  return { bid: best, tier: used };
}

/* その段が実際にいくらの手数料になるかを、言葉で書く */
function tierLabel(auction, tier, catIndex) {
  if (auction.fee.kind === 'cats')   return auction.fee.cats[catIndex].label + ' ' + tier.rate + '%';
  if (auction.fee.kind === 'custom') return '手入力 ' + tier.rate + '%';
  if (auction.fee.kind === 'rate')   return tier.rate + '%';
  const hi = tier.hi === Infinity ? '〜' : '〜' + tier.hi.toLocaleString('ja-JP') + '円';
  return tier.lo.toLocaleString('ja-JP') + '円' + hi + ' → '
       + (tier.yen ? '定額' + tier.yen.toLocaleString('ja-JP') + '円' : tier.rate + '%');
}

/* ---------------------------------------------------------------- 計算 */
function calc() {
  readInputsToState();
  saveAll();

  const s = modeState[currentMode];
  const auction = currentAuction();
  const tiers = feeTiers(auction, s.catIndex);

  const saleInput = num('salePrice');
  const pf = s.platformFee / 100, tax = s.tax / 100, mg = s.margin / 100;

  if (!saleInput) {
    $('rcMain').className = 'rc-main empty';
    $('rcMain').textContent = '売価を入れてください';
    ['rcInc','rcProfit','rcFee','rcBreakdown'].forEach(id => $(id).style.display = 'none');
    renderSellList();
    return;
  }

  let preTax, bidInc = null, auctionYen, totalCost, profit, netSale, lines;

  if (currentMode === 'retail') {
    let saleJPY = saleInput;
    if ($('currency').value === 'USD') saleJPY = saleInput * num('fxRate');
    const shipping = s.shipping, listing = s.listing;
    netSale = saleJPY * (1 - pf);
    const available = Math.max(netSale * (1 - mg) - shipping - listing, 0);
    //   available = 仕入れ値*(1+消費税) + 仕入手数料
    const res = solveWithTiers(tiers, (rate, fixed) => Math.max((available - fixed) / (1 + tax + rate), 0));
    preTax = res.bid;
    auctionYen = preTax * (res.tier.rate / 100) + res.tier.yen;
    totalCost  = preTax * (1 + tax) + auctionYen + shipping + listing;
    profit     = netSale - totalCost;
    lines = ['仕入消費税 ' + yen(preTax * tax) + '／送料・出品代行 ' + yen(shipping + listing),
             '総原価 ' + yen(totalCost) + '／販売手数料を引いた売上 ' + yen(netSale)];
    var usedTier = res.tier;

  } else if (s.taxIn) {
    /* 内税：売価は税抜で入力。利益は税込売上に対して見る。 */
    const saleEx = saleInput, saleInc = saleEx * (1 + tax);
    const pfYen = saleEx * pf;
    const available = Math.max(saleInc - saleInc * mg - pfYen - s.otherCost, 0);
    //   available = 入札(税込) + 仕入手数料　※段の判定は税抜の落札額で行う
    const res = solveWithTiers(tiers, (rate, fixed) => Math.max((available - fixed) / (1 + rate) / (1 + tax), 0));
    preTax = res.bid;
    bidInc = preTax * (1 + tax);
    auctionYen = bidInc * (res.tier.rate / 100) + res.tier.yen;
    totalCost  = pfYen + s.otherCost + bidInc + auctionYen;
    profit     = saleInc - totalCost;
    netSale    = saleInc;
    lines = ['販売手数料 ' + yen(pfYen) + '／その他費用 ' + yen(s.otherCost),
             '総原価 ' + yen(totalCost) + '／税込売上 ' + yen(saleInc)];
    var usedTier = res.tier;

  } else {
    netSale = saleInput * (1 - pf);
    const available = Math.max(netSale * (1 - mg) - s.otherCost, 0);
    //   available = 仕入れ値 + 仕入手数料
    const res = solveWithTiers(tiers, (rate, fixed) => Math.max((available - fixed) / (1 + rate), 0));
    preTax = res.bid;
    auctionYen = preTax * (res.tier.rate / 100) + res.tier.yen;
    totalCost  = preTax + auctionYen + s.otherCost;
    profit     = netSale - totalCost;
    lines = ['その他費用 ' + yen(s.otherCost),
             '総原価 ' + yen(totalCost) + '／販売手数料を引いた売上 ' + yen(netSale)];
    var usedTier = res.tier;
  }

  $('rcMain').className = 'rc-main';
  $('rcMain').textContent = yen(preTax);

  if (bidInc !== null) {
    $('rcInc').style.display = 'block';
    $('rcInc').textContent = '税込 ' + yen(bidInc);
  } else {
    $('rcInc').style.display = 'none';
  }

  const rate = netSale ? (profit / netSale * 100) : 0;
  $('rcProfit').style.display = 'block';
  $('rcProfit').innerHTML = '利益額 ' + yen(profit)
    + '<span>売上比 ' + rate.toFixed(1) + '%</span>';

  $('rcFee').style.display = 'block';
  $('rcFee').innerHTML = '仕入手数料 ' + yen(auctionYen)
    + '　<b>' + auction.name + '：' + tierLabel(auction, usedTier, s.catIndex) + '</b>';

  $('rcBreakdown').style.display = 'block';
  $('rcBreakdownIn').innerHTML = lines.join('<br>');

  renderSellList();
}

function renderSellList() {
  const price = sellPriceForList();
  const box = $('sellList');
  if (!price) {
    box.innerHTML = '<div class="hint">売価を入れると、それぞれの会場でいくら引かれるか出ます。</div>';
    $('sellSummary').textContent = '';
    $('sellNote').textContent = '';
    return;
  }
  const kind = sellKind(), brand = sellBrand();
  const list = SELL_VENUES
    .filter(v => !v.onlyKinds || v.onlyKinds.indexOf(kind) >= 0)
    .map(v => {
      const c = sellCost(v, price, kind, brand);
      return { v, yen: c.yen, label: c.label, net: price - c.yen };
    })
    .sort((a, b) => a.yen - b.yen);

  const best = list[0];
  box.innerHTML = list.map((r, i) => {
    const rate = price ? (r.yen / price * 100) : 0;
    const parts = [r.label];
    if (r.v.perItemLabel) parts.push(r.v.perItemLabel);
    return '<div class="sv' + (i === 0 ? ' best' : '') + '" data-rate="' + rate.toFixed(2) + '" data-name="' + r.v.name + '">'
      + '<div class="sv-rank">' + (i === 0 ? '★' : (i + 1)) + '</div>'
      + '<div class="sv-name">' + r.v.name
      + '<small>' + parts.join('＋') + (r.v.note ? '　' + r.v.note : '') + '</small></div>'
      + '<div class="sv-fee">' + yen(r.yen) + '<small>手取り ' + yen(r.net) + '</small></div>'
      + '</div>'
      + (r.v.fail ? '<div class="sv-fail">売れなかったとき：' + r.v.fail + '</div>' : '');
  }).join('');

  $('sellSummary').textContent = '（' + yen(price) + 'なら ' + best.v.name + ' が一番安い／' + yen(best.yen) + '）';
  $('sellNote').innerHTML = '手数料の安い順。★が一番手取りが多い会場です。行を押すと、その会場の実効率が上の販売手数料に入ります。'

/* ------------------------------------------------------------------ 為替
   これまでは「JPYからUSDに切り替えたときだけ」取りに行き、
   一度入ったら二度と更新しなかった。しかも失敗しても何も出なかったので、
   取れているのかどうか分からなかった。

   直したこと
     ・取得先を3つ用意して、順に試す（1つ落ちていても止まらない）
     ・取れたレートは取得時刻と一緒に覚えておく
     ・6時間より古ければ、開いたときに自動で取り直す
     ・取得中・取得時刻・失敗を画面に出す
     ・「再取得」ボタンをつける
     ・USD/JPYの選択を次に開いたときも覚える
   ------------------------------------------------------------------ */
const FX_KEY = 'siirene_fx_v1';
const FX_MAX_AGE_MS = 6 * 60 * 60 * 1000;   // 6時間
const FX_SOURCES = [
  { name: 'open.er-api',      url: 'https://open.er-api.com/v6/latest/USD',
    pick: (j) => j && j.rates && j.rates.JPY },
  { name: 'exchangerate-api', url: 'https://api.exchangerate-api.com/v4/latest/USD',
    pick: (j) => j && j.rates && j.rates.JPY },
  { name: 'currency-api',     url: 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json',
    pick: (j) => j && j.usd && j.usd.jpy }
];

function fxLoadCache() {
  try {
    const o = JSON.parse(localStorage.getItem(FX_KEY) || 'null');
    if (o && o.rate > 0 && o.at) return o;
  } catch (e) {}
  return null;
}
function fxSaveCache(rate, source) {
  try { localStorage.setItem(FX_KEY, JSON.stringify({ rate: rate, at: Date.now(), source: source })); } catch (e) {}
}
function fxSetStatus(text, warn) {
  const el = $('fxStatus');
  if (!el) return;
  el.textContent = text;
  el.style.color = warn ? '#b06a00' : '#9aa0a8';
}
function fxTimeText(at) {
  const d = new Date(at);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

let fxFetching = false;
async function fetchFx(force) {
  if (fxFetching) return;
  const cached = fxLoadCache();
  if (!force && cached && Date.now() - cached.at < FX_MAX_AGE_MS) {
    $('fxRate').value = Number(cached.rate).toFixed(2);
    fxSetStatus(`自動取得（${fxTimeText(cached.at)} 時点）`);
    calc();
    return;
  }
  fxFetching = true;
  fxSetStatus('取得中…');
  for (const src of FX_SOURCES) {
    try {
      const res = await fetch(src.url, { cache: 'no-store' });
      if (!res.ok) continue;
      const rate = src.pick(await res.json());
      if (rate > 0) {
        $('fxRate').value = Number(rate).toFixed(2);
        fxSaveCache(rate, src.name);
        fxSetStatus(`自動取得（${fxTimeText(Date.now())} 時点）`);
        fxFetching = false;
        calc();
        return;
      }
    } catch (e) { /* 次の取得先へ */ }
  }
  fxFetching = false;
  if (cached) {
    $('fxRate').value = Number(cached.rate).toFixed(2);
    fxSetStatus(`いま取得できないので、前回の値（${fxTimeText(cached.at)} 時点）を使っています`, true);
  } else {
    fxSetStatus('自動取得できませんでした。手で入力してください', true);
  }
  calc();
}

$('fxRefresh').addEventListener('click', () => fetchFx(true));

// 開いた時点で、小売なら取りに行っておく（USDに切り替えた瞬間に待たされないように）
if (currentMode === 'retail') fetchFx(false);
</script>
